<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barrows &amp; Banshees Character Generator</title>
    <script>
      // Applies the theme before first paint. Mirrors readSavedTheme + resolveTheme in src/rules/theme.ts.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
  </head>
  <body>
    <header>
      <h1>Barrows &amp; Banshees</h1>
      <form id="roll-form">
        <label for="class-picker">Class</label>
        <select id="class-picker" name="class">
          <option value="">Random</option>
        </select>
        <button type="submit">Roll a Character</button>
        <button type="button" id="print-button" disabled>Print</button>
        <button type="button" id="theme-toggle" aria-pressed="false">Dark mode</button>
      </form>
    </header>
    <main id="sheet" aria-live="polite">
      <p class="empty-state">Pick a class, or leave it on Random, then roll a character.</p>
    </main>
    <div id="print-sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
